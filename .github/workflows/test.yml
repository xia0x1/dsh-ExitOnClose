name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The unit tests cover pure process-tree rules and import nothing else, so
      # they need no install step and no native dependency.
      - run: node --test "test/*.test.mjs"
